          litellm: {score: yes, source: docs, evidence: "https://docs.litellm.ai/docs/routing"}
          portkey: {score: yes, source: docs, evidence: "https://portkey.ai/docs/product/ai-gateway/fallbacks"}
          bifrost: {score: yes, source: docs, evidence: "https://github.com/maximhq/bifrost"}
          helicone: {score: unknown, source: unknown, note: "citation 404'd on 2026-08-31; re-verify before publishing"}
          openrouter: {score: yes, source: docs, evidence: "https://openrouter.ai/docs/features/provider-routing"}
          cloudflare: {score: yes, source: docs, evidence: "https://developers.cloudflare.com/ai-gateway/configuration/fallbacks/"}
          vercel: {score: yes, source: docs, note: "automatic provider failover", evidence: "https://vercel.com/docs/ai-gateway/provider-options"}

      - id: load_balancing
        name: Weighted load balancing
        why: Spread spend and quota across keys and regions
