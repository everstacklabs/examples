          helicone: {score: unknown, source: unknown}
          openrouter: {score: no, source: docs, evidence: "https://openrouter.ai/docs"}
          cloudflare: {score: unknown, source: unknown}
          vercel: {score: unknown, source: unknown}

      - id: cache_tenant_isolation
        name: Cache is tenant-isolated
        why: "A shared cache key across tenants is a data leak, not a cache (scenario C10)"
        weight: 2
        cells:
          everstack: {score: unknown, source: unknown, note: "probe after first full run"}
          litellm: {score: unknown, source: unknown}
          portkey: {score: unknown, source: unknown}
          bifrost: {score: unknown, source: unknown}
          helicone: {score: unknown, source: unknown}
          openrouter: {score: unknown, source: unknown}
          cloudflare: {score: unknown, source: unknown}
          vercel: {score: unknown, source: unknown}

