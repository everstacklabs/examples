  - id: caching
    name: Caching
    summary: >-
      A cache is only a feature if it is also correct. Scenario C10 checks the
      thing nobody publishes: whether one tenant can be served another tenant's
      cached completion.
    dimensions:
      - id: exact_cache
        name: Exact-match cache
        why: Repeated prompts stop costing money
        cells:
          everstack: {score: yes, source: repo, evidence: "internal/config/gateway, cache.enabled"}
