    dimensions:
      - id: multi_provider
        name: Multi-provider routing
        why: One integration instead of one per vendor
        cells:
          everstack: {score: yes, source: repo, note: "28 provider packages", evidence: "internal/providers/"}
          litellm: {score: yes, source: docs, note: "100+ providers", evidence: "https://docs.litellm.ai/docs/providers"}
          portkey: {score: yes, source: docs, evidence: "https://portkey.ai/docs/integrations/llms"}
          bifrost: {score: yes, source: docs, evidence: "https://github.com/maximhq/bifrost"}
          helicone: {score: yes, source: docs, evidence: "https://docs.helicone.ai/gateway/provider-routing"}
          openrouter: {score: yes, source: docs, evidence: "https://openrouter.ai/models"}
          cloudflare: {score: yes, source: docs, evidence: "https://developers.cloudflare.com/ai-gateway/providers/"}
          vercel: {score: yes, source: docs, evidence: "https://vercel.com/docs/ai-gateway/models-and-providers"}

      - id: fallback
        name: Automatic failover
        why: A provider incident stops being your outage
