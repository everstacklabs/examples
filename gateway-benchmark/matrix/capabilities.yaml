          litellm: {score: yes, source: docs, evidence: "https://docs.litellm.ai/docs/proxy/caching"}
          portkey: {score: paid, source: docs, evidence: "https://portkey.ai/docs/product/ai-gateway/cache-simple-and-semantic"}
