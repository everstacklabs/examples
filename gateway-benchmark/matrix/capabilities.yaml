# AI gateway capability matrix.
#
# Rules this file follows, enforced by `gwbench matrix`:
#   - Every scored cell carries an evidence link and a source.
#   - `unknown` is a legitimate value and is excluded from scoring in BOTH
#     directions, so a competitor we have researched less does not look worse
#     than one we researched thoroughly.
#   - Everstack's own cells cite this repo by path, not marketing copy. Where we
#     do not have something, the cell says `no`. A matrix where the author wins
#     every row is not evidence.
#
# source values:
#   repo    verified in Everstack's source at the cited path
#   probe   measured by this harness in a benchmark run
#   docs    stated in the vendor's public documentation on the verified date
#   unknown not yet checked
#
# A disclosure about `source: repo`, since it only applies to one vendor:
# Everstack's source tree is not public, so those citations are real file paths
# that a reader outside the company cannot follow. Treat them as the weakest
# evidence class in this file, not the strongest. The intended remedy is not to
# be believed: run the harness. Most of what the Everstack column claims about
# routing, caching, limits, and token accounting is probed by scenarios C1-C11
# against any deployment, and a probe verdict overrides a repo citation.

version: 1
verified_on: "2026-08-31"
subject: everstack

vendors:
  - id: everstack
    name: Everstack
    tier: self-hosted + managed
    license: source-available (CE/EE split)
    docs: https://everstack.ai
    benchmarked: true

  - id: litellm
    name: LiteLLM
    tier: self-hosted + managed
    license: MIT (proxy features partly enterprise)
    docs: https://docs.litellm.ai/
    benchmarked: true

  - id: portkey
    name: Portkey
    tier: self-hosted (OSS core) + managed
    license: MIT gateway, commercial control plane
    docs: https://portkey.ai/docs
    benchmarked: true

  - id: bifrost
    name: Bifrost
    tier: self-hosted
    license: Apache-2.0
    docs: https://github.com/maximhq/bifrost
    benchmarked: true

  - id: helicone
    name: Helicone
    tier: self-hosted + managed
    license: Apache-2.0 gateway, commercial cloud
    docs: https://docs.helicone.ai/
    benchmarked: true

  - id: openrouter
    name: OpenRouter
    tier: cloud only
    license: proprietary
    docs: https://openrouter.ai/docs
    benchmarked: false

  - id: cloudflare
    name: Cloudflare AI Gateway
    tier: cloud only
    license: proprietary
