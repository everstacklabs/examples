# Tier-1 gateway benchmark stack.
#
# Every gateway here proxies to the same `upstream` service, so their overhead
# can be isolated. Cloud-only gateways (OpenRouter, Cloudflare AI Gateway,
# Portkey Cloud) are deliberately absent: measuring one of those from a laptop
# measures the internet, not the gateway. They live in the feature matrix.
#
# Fairness rules for this file:
#   1. Every image is version-pinned. "latest" makes a result unreproducible.
#   2. Debug logging is off everywhere. Leaving it on for a competitor and off
#      for us would be rigging the result.
#   3. Each competitor runs the settings its own docs recommend for production.
#      Where a setting is a judgement call, the comment says why.
#
# Usage:
#   make up                # mock upstream + every public competitor
#   make up-subject        # the above plus Everstack (needs EVERSTACK_IMAGE)
#   make validate          # confirm every container actually answers
#   make bench

name: gwbench

services:
  # ---------------------------------------------------------------------------
  # The single deterministic upstream.
  #
  # /p/primary   healthy by default, the target of every gateway's main route
  # /p/secondary the failover destination
  # ---------------------------------------------------------------------------
  upstream:
    build:
      context: ..
      dockerfile: compose/Dockerfile.upstream
    container_name: gwbench-upstream
    ports:
      - "9800:9800"
    healthcheck:
      test: ["CMD", "/mockupstream", "-h"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # Everstack: the subject under test.
  #
  # Benchmarked on /openai/v1, NOT /v1. The /v1 surface accepts OpenAI-format
  # requests but returns proto-JSON, so an SSE client cannot read it
  # (internal/api/api.go:571).
  # ---------------------------------------------------------------------------
  everstack:
    # Built from the public release binary rather than pulled from the private
    # container registry, so the subject under test is reproducible by anyone.
    # Override EVERSTACK_IMAGE to benchmark a specific prebuilt image instead.
    image: ${EVERSTACK_IMAGE:-gwbench-everstack:v0.1.25}
    build:
      context: ./everstack
      dockerfile: Dockerfile
      args:
        EVERSTACK_VERSION: ${EVERSTACK_VERSION:-v0.1.25}
    container_name: gwbench-everstack
    # Behind a profile so `docker compose up` brings up the mock upstream and
    # every public competitor without needing credentials at all. The subject is
    # opt-in: `docker compose --profile subject up -d`.
    profiles: ["subject"]
    depends_on:
      - upstream
      - everstack-db
      - everstack-redis
      - everstack-clickhouse
    ports:
      - "8080:8080"
    command: ["serve", "--config", "/etc/everstack/gateway.yaml", "--port", "8080"]
    volumes:
      - ./everstack/gateway.yaml:/etc/everstack/gateway.yaml:ro
    environment:
      - EVS_DATABASE_MODE=hybrid
      - EVS_POSTGRES_DSN=postgres://postgres:postgres@everstack-db:5432/everstack?sslmode=disable
      - EVS_CACHE_TYPE=redis
      - EVS_CACHE_REDIS_ADDRESS=everstack-redis:6379
      - EVS_CLICKHOUSE_DSN=clickhouse://default:clickhouse@everstack-clickhouse:9000/everstack
      - EVS_API_KEY_HASH_SECRET=${EVS_API_KEY_HASH_SECRET:-bench-only-not-a-production-secret}
      # The upstream ignores the key's value; it only records a fingerprint so
      # the tenant-isolation scenario can tell two callers apart.
      - EVS_PROVIDERS_OPENAI_API_KEY=bench-upstream-key
      - EVS_LOG_LEVEL=warn

  everstack-db:
    profiles: ["subject"]
    image: postgres:16-alpine
    container_name: gwbench-everstack-db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=everstack
    # tmpfs, not a volume: benchmark state is disposable and a disk-backed
    # Postgres would put fsync latency into the gateway's numbers.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  # ClickHouse backs Everstack's trace and log storage. It is included rather
  # than switched off because disabling it would remove the observability write
  # path from the request, making the subject look faster by doing less work
  # than its own recommended configuration. Benchmarking ourselves in a stripped
  # mode nobody runs in production would be the self-flattering choice.
  everstack-clickhouse:
    profiles: ["subject"]
    image: clickhouse/clickhouse-server:25.8-alpine
    container_name: gwbench-everstack-clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_DB=everstack
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    tmpfs:
      - /var/lib/clickhouse

  everstack-redis:
    profiles: ["subject"]
    image: redis:7-alpine
    container_name: gwbench-everstack-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # ---------------------------------------------------------------------------
  # LiteLLM Proxy. The OSS default and the one with the most mindshare.
  #
  # --num_workers 4 rather than the single-worker default: LiteLLM's own
  # production docs call for multiple workers, and benchmarking it with one
  # would be a rigged comparison.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    container_name: gwbench-litellm
    depends_on:
      - upstream
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_BENCH_KEY:-sk-bench-master}
      - LITELLM_LOG=ERROR
      - OPENAI_API_KEY=bench-upstream-key

  # ---------------------------------------------------------------------------
  # Bifrost. Markets itself on raw proxy speed, so it is the hardest
  # overhead comparison and the most useful one to publish.
  # ---------------------------------------------------------------------------
  bifrost:
    # v2.0.0 is the current release. Benchmarking a year-old build of the
    # gateway that markets itself on speed would be the rigged kind of unfair.
    image: maximhq/bifrost:v2.0.0
    container_name: gwbench-bifrost
    depends_on:
      - upstream
    ports:
      - "8081:8080"
    volumes:
      # Bifrost v2 reads its config from $APP_DIR, which defaults to /app/data,
      # not /app/config. Mounting the wrong path fails open: the gateway starts
      # healthy and then 400s every request with "could not auto resolve a
      # provider", which looks like a bad request rather than a missing config.
      - ./bifrost:/app/data
    environment:
      - APP_PORT=8080
      - OPENAI_API_KEY=bench-upstream-key
      - LOG_LEVEL=debug

  # ---------------------------------------------------------------------------
  # Helicone AI Gateway. Rust router with observability-adjacent positioning.
  # ---------------------------------------------------------------------------
  helicone:
    # This project publishes no version tags at all: Docker Hub carries only
    # `latest`, `main`, and per-commit shas. Pinned to the sha that `latest`
    # pointed at, since an unpinned tag makes a result unreproducible. That
    # image was last updated 2025-07-30, checked 2026-08-31.
    image: helicone/ai-gateway:sha-42d2998
    # amd64-only: the image has no arm64 manifest, so on Apple Silicon this runs
    # under emulation. THAT MAKES ITS LATENCY AND CPU NUMBERS NOT COMPARABLE to
    # the natively-running targets, often by several times. targets.yaml marks
    # this target `emulated_on_arm64: true` so the report says so rather than
    # letting a reader compare the rows naively. On an amd64 host the flag is
    # harmless and the numbers are directly comparable.
    platform: linux/amd64
    container_name: gwbench-helicone
    depends_on:
      - upstream
    ports:
      - "8082:8080"
    volumes:
      - ./helicone/config.yaml:/etc/helicone/config.yaml:ro
    # The config path is a CLI flag, not an env var. Setting CONFIG_FILE alone
    # is silently ignored: the gateway starts fine and then routes to the real
    # provider instead of the mock, which looks like a credential problem rather
    # than a config one.
    command: ["/usr/local/bin/ai-gateway", "-c", "/etc/helicone/config.yaml"]
    environment:
      - OPENAI_API_KEY=bench-upstream-key
      - RUST_LOG=info

  # ---------------------------------------------------------------------------
  # Portkey Gateway (the OSS core of the closest commercial competitor).
  #
  # This gateway takes its routing per request via x-portkey-* headers rather
  # than a server-side config file, so its upstream is set in targets.yaml.
  # ---------------------------------------------------------------------------
  portkey:
    image: portkeyai/gateway:1.15.2
    container_name: gwbench-portkey
    depends_on:
      - upstream
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - LOG_LEVEL=error
