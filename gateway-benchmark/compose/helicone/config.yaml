# Helicone AI Gateway configuration for the gateway benchmark.
#
# Routed at the same mock upstream as every other target. Telemetry export is
# off: Helicone's value is its observability, but shipping spans to a cloud
# endpoint during a latency benchmark would measure the network, and none of
# the other targets are paying that cost here. The observability capability is
# scored in the feature matrix instead, which is the right place for it.

server:
  address: 0.0.0.0
  port: 8080

routers:
  default:
    load-balance:
      chat:
        strategy: latency
        providers:
          - openai

providers:
  openai:
    # Root, with no path. This gateway does not preserve a base-url path:
    # given http://upstream:9800/p/primary it requests /p/v1/chat/completions,
    # dropping the profile segment. The mock serves the primary profile at the
    # root path too, so pointing at the root routes correctly.
    #
    # Consequence: this target cannot be aimed at the secondary profile, so it
    # has no failover destination and scenario C1 reports `not configured`
    # rather than a pass or a fail. That is a limitation of this setup, not a
    # statement about the product.
    base-url: http://upstream:9800
    models:
      - bench-model

telemetry:
  level: error
