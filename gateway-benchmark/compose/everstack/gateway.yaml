# Everstack gateway configuration for the AI gateway benchmark.
#
# This is the subject under test. It is deliberately configured the way we would
# tell a customer to run it, not stripped down to win a latency table: streaming
# on, fallback on, exact cache on, observability on. If that costs us
# milliseconds against a bare proxy, the report says so.
#
# Benchmarked surface: /openai/v1/chat/completions.
# NOT /v1/chat/completions, which accepts OpenAI-format requests but returns
# proto-JSON that an SSE client cannot read (internal/api/api.go:571).

server:
  config:
    port: 8080
    external_domain: localhost
  cors:
    enabled: false
  security:
    # Literal, not ${EVS_API_KEY_HASH_SECRET}: this config file is not passed
    # through envsubst, so a variable reference is stored verbatim and the
    # server then hashes API keys with the literal string "${EVS_API_KEY_HASH_SECRET}"
    # instead of the value. Every key check fails with "Invalid API key" and
    # nothing in the logs points at the cause. Benchmark-only value.
    api_key_hash_secret: "bench-only-not-a-production-secret"
  telemetry:
    otel:
      enabled: true
      mode: embedded
      collector_url: "everstack-otel:4317"
      # Export straight to ClickHouse rather than over OTLP. `embedded` mode
      # otherwise ships spans to localhost:4317, and with no collector in this
      # container every export fails and back-pressures the request path: the
      # gateway could not drain 50 rps and p50 latency reached 11 SECONDS,
      # which is a broken telemetry sink being measured as proxy overhead.
      #
      # Telemetry stays ON. Turning it off would make the subject look faster
      # by doing less work than its own recommended configuration.
      direct_export:
        enabled: true
      service_name: "everstack-gwbench"
      tenant_type: "self_hosted"
      tracing:
        # Full sampling. Sampling down would understate the cost of the
        # observability the rest of this report argues is the differentiator,
        # which would be flattering and dishonest.
        sampling_rate: 1.0
        granularity: standard
        trace_provider_calls: true
        trace_stream_chunks: false
        trace_fallbacks: true

database:
  mode: hybrid
  postgres:
    dsn: "${EVS_POSTGRES_DSN}"

auth:
  mode: "builtin"
  builtin:
    session_secure: false
    session_same_site: "lax"
    session_secret: "bench-only-session-secret-not-for-production-use-000"
    session_max_age: 3600

cache:
  # Exact-match cache on. Scenario C7 proves it hits; C10 proves a hit is not
  # readable across tenants, which is the check that actually matters.
  enabled: true
  type: redis
  redis:
    address: "everstack-redis:6379"
    db: 0
    ttl: 10m
    pool_size: 100
  semantic:
    # Off for the benchmark. Semantic cache adds an embedding round trip that
    # no other target in the comparison pays for, so leaving it on would make
    # our own numbers look worse for a capability the matrix scores separately.
    enabled: false

gateway:
  models:
    # The `openai` provider with a custom base_url, rather than
    # `openai_compatible`. Everstack resolves a request's model against its
    # model catalog, and the catalog ships no entries for openai_compatible, so
    # a request there fails with "no provider found for model" no matter what
    # the YAML declares. Using a catalogued model name against a redirected
    # base_url is how a real deployment points at a private endpoint.
    #
    # The mock upstream echoes back whatever model name it is given, so the
    # name only has to satisfy the catalog.
    - provider: openai
      model:
        - gpt-4o-mini
      api_key: "bench-upstream-key"
      base_url: http://upstream:9800/p/primary/v1
      max_tokens: 4096
      default_alias: gpt-4o-mini

  load_balancer:
    enabled: true
    strategy: weighted
    # Required whenever the load balancer is enabled; config validation refuses
    # to start without it.
    key_source: api_key
    fallback:
      enabled: true
      default:
        enabled: true
        provider: openai
        model: gpt-4o-mini
        max_tokens: 4096
        temperature: 0

  rate_limit:
    # Off for the performance phases: a limit that trips mid-run would corrupt
    # every latency number. The rate-limit scenario (C5) is run separately
    # against a deployment that enables this block.
    enabled: false
    requests_per_minute: 6000
    burst: 600
    key_source: api_key

features:
  gateway:
    # Both required for the streaming phases. Streaming is gated on the YAML
    # toggle as well as the license manifest (internal/features/resolver.go:55),
    # and a self-hosted run with no manifest poller resolves from YAML alone.
    enable_streaming: true
    enable_sse: true
    enable_semantic_cache: false
